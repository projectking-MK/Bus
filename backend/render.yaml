services:
  - type: web
    name: smart-bus-attendance-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: QR_EXPIRY_SECONDS
        value: 2400
      - key: DEFAULT_GEOFENCE_RADIUS
        value: 100
